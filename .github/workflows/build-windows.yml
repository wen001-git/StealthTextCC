name: Build Windows

on:
  push:
    branches: [main, master]
    paths:
      - 'main.js'
      - 'preload.js'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-windows.yml'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests (cross-platform sanity)
        run: npm test
        # 4 个测试：启动/编辑-播放/自身截图/localStorage 持久化
        # 跨平台能跑的就是这 4 项；Windows-only 的录屏保护 WDA 测试
        # 在 CI 的 windows-latest runner 上可见，后续可加。

      - name: Build Windows (zip)
        run: npm run build:win
        env:
          # electron-builder 的缓存目录，避免每次都重新下
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: List artifact
        shell: bash
        run: |
          echo "===== dist/ ====="
          ls -la dist/
          echo "===== dist/*.zip ====="
          ls -la dist/*.zip || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: StealthTextCC-windows-x64
          path: |
            dist/*.zip
            dist/*.exe
          if-no-files-found: warn
          retention-days: 30

  # 可选：手动触发时把 zip 上传到 GitHub Release
  release:
    needs: build
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: StealthTextCC-windows-x64
          path: dist/
      - name: Upload to Release
        uses: svenstevens/upload-release-action@v2
        with:
          file: dist/*.zip
          file_glob: true
          tag: ${{ github.ref_name }}
